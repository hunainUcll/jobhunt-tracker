<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">JobHunt Tracker</title>
  <desc id="description">A purple and navy banner for a local-first job application tracker, with an abstract application card and a green privacy indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#28205b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1180" cy="45" r="220" fill="#6366f1" opacity=".08"/>
  <circle cx="1020" cy="350" r="210" fill="#818cf8" opacity=".06"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="62" y="52" width="50" height="50" rx="14" fill="url(#accent)"/>
    <g fill="none" stroke="#fff" stroke-width="2.4"><rect x="74" y="69" width="26" height="19" rx="3"/><path d="M82 69v-4h10v4M74 77c8 5 18 5 26 0M87 78v5"/></g>
    <text x="62" y="173" fill="#fff" font-size="53" font-weight="700" letter-spacing="-1.5">JobHunt Tracker<tspan fill="#a78bfa">.</tspan></text>
    <text x="64" y="213" fill="#c7c9dd" font-size="21">Your next chapter, organized.</text>
    <g font-size="13" font-weight="600">
      <rect x="64" y="252" width="112" height="32" rx="16" fill="#393154"/><text x="86" y="273" fill="#d8d0fb">LOCAL-FIRST</text>
      <rect x="188" y="252" width="113" height="32" rx="16" fill="#393154"/><text x="210" y="273" fill="#d8d0fb">GMAIL READY</text>
      <rect x="313" y="252" width="122" height="32" rx="16" fill="#393154"/><text x="335" y="273" fill="#d8d0fb">OPTIONAL AI</text>
    </g>
    <g transform="translate(815 59)">
      <rect x="21" y="14" width="342" height="250" rx="18" fill="#070b17" opacity=".3"/>
      <rect width="342" height="250" rx="18" fill="#1c2438" stroke="#414866"/>
      <text x="24" y="38" fill="#fff" font-size="16" font-weight="600">A little progress, every day</text>
      <circle cx="310" cy="33" r="5" fill="#34d399"/>
      <g transform="translate(24 63)">
        <rect width="90" height="61" rx="9" fill="#2d3450"/><text x="13" y="24" fill="#b6bfd6" font-size="10">APPLICATIONS</text><rect x="13" y="35" width="34" height="10" rx="3" fill="#a5b4fc"/>
        <rect x="101" width="90" height="61" rx="9" fill="#2d3450"/><text x="114" y="24" fill="#b6bfd6" font-size="10">NEXT STEPS</text><rect x="114" y="35" width="25" height="10" rx="3" fill="#fcd34d"/>
        <rect x="202" width="90" height="61" rx="9" fill="#2d3450"/><text x="215" y="24" fill="#b6bfd6" font-size="10">INTERVIEWS</text><rect x="215" y="35" width="32" height="10" rx="3" fill="#6ee7b7"/>
      </g>
      <rect x="24" y="143" width="292" height="43" rx="9" fill="#262e46"/><circle cx="46" cy="164" r="9" fill="#6366f1"/><rect x="65" y="157" width="149" height="5" rx="2" fill="#b6bfd6"/><rect x="65" y="169" width="102" height="4" rx="2" fill="#66718e"/>
      <text x="26" y="222" fill="#6ee7b7" font-size="11">Your data stays in your local workspace.</text>
    </g>
  </g>
</svg>
